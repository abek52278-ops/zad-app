[project]
id = "auuftqncrjsnyylolhbu"

# JWT verification per function, declared because `supabase functions deploy` applies
# these on every deploy and defaults to `verify_jwt = true` for anything it does not find
# here. Two of these functions run with it OFF on purpose, and letting the CLI's default
# silently turn it on would break them:
#
#   zad-telegram-bot   Telegram's webhook posts with no Authorization header at all.
#                      Requiring a JWT would reject every update and kill the bot.
#   zad-brain          Called by the Telegram bot and by cron paths that carry their own
#                      shared-secret headers rather than a user JWT; it authenticates
#                      callers itself.
#
# The values here are the ones the project is actually running (read back from the
# deployed functions on 2026-08-15), not aspirations — this file exists to keep automated
# deploys from changing behaviour nobody asked to change.

[functions.zad-core-intelligence]
verify_jwt = true

[functions.zad-brain]
verify_jwt = false

[functions.delete-account]
verify_jwt = true

[functions.zad-telegram-bot]
verify_jwt = false

# ── أضيف 2026-08-31 (بند 30.6ب) ────────────────────────────────────────────
# الدوال التحت كانت **مش معرَّفة** هنا، والـ CLI بيفترض verify_jwt = true لأي
# دالة مش لاقيها. تلاتة منهم منشورين فعلياً بـ false، يعني أول ديبلوي آلي كان
# هيقلبهم true ويكسرهم من غير ما حد يطلب — بالظبط الخطر اللي الملف ده اتعمل
# عشانه. القيم دي مقروءة من الدوال المنشورة نفسها (2026-08-31)، مش أمنيات.
#
# ⚠️ update-behavior-profile مالوش أي حارس داخلي وشغال بمفتاح الخدمة، فـ
#    verify_jwt = false معناها إنه مفتوح للإنترنت. القيمة دي **بتحافظ على
#    السلوك الحالي مش بتباركه**: الكرون بينده بمفتاح ديمو مزيّف
#    ("iss":"supabase-demo" في 20260721150210) فلو اتقلب true الكرون هيقع
#    بصمت — وpg_net بيأكد إن الطلب اتصف بس، مش إنه نجح. الإصلاح الصح
#    (سيكريت مخصص + إعادة جدولة الكرون) مسجّل كبند 30.11.
[functions.amazon-creators-search]
verify_jwt = false

[functions.update-behavior-profile]
verify_jwt = false

[functions.voice-selftest]
verify_jwt = false

[functions.verify-purchase]
verify_jwt = true

[functions.affiliate-price-refresh]
verify_jwt = true

[functions.parent-digest]
verify_jwt = true

# مقصود إنها false: إشعارات Google Play RTDN بتوصل من Pub/Sub وهي **مبتحملش
# توكن سوبابيز خالص**، فـ verify_jwt = true كانت بترفضها عند البوابة قبل ما
# الدالة تشتغل أصلاً. ده السبب الحقيقي إن تتبع التجديد/الإلغاء مكانش شغال —
# الأعمدة الغلط كانت العَرَض التاني مش الأول. البديل للتوثيق: سيكريت في
# الـ query string بتاع push endpoint (ZAD_RTDN_SECRET)، نفس نمط
# X-Checkin-Cron-Secret الموجود.
[functions.zad-billing-webhook]
verify_jwt = false

# Added 2026-08-31: Market Intelligence — جمع بيانات الأسواق الحية
# Called by cron job (no user JWT); no internal authentication needed
[functions.zad-market-intelligence]
verify_jwt = false

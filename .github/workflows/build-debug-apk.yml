name: Build Debug APK

on:
  push:
    branches: [main, feat/ui-redesign]
  pull_request:
  workflow_dispatch: {}

# Explicit least-privilege GITHUB_TOKEN — this job only reads code, builds, tests,
# lints, and uploads artifacts; it never writes back to the repo. Read-only was
# already the implicit default, spelled out here so that stays true on purpose
# instead of by accident as the workflow grows.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Migrated from the now-disabled android.yml — that workflow restored this and
      # this one didn't, so this build was silently shipping without Firebase/FCM
      # wired in (build.gradle.kts only applies com.google.gms.google-services when
      # this file exists on disk).
      - name: Restore google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > app/google-services.json

      # GEMINI_API_KEY is intentionally NOT read from secrets — the app doesn't need it.
      # AI runs server-side in Supabase on ZAD_API_KEY_1..5 (Gemini pool, primary) with
      # GROQ_API_KEY_1/_2 as the text-only fallback; the only client-side use of a Gemini
      # key is the optional personal key a user types into the camera screen at runtime.
      # "unused" is a harmless placeholder so the Secrets Gradle Plugin has something to inject.
      - name: Write .env
        run: |
          echo "GEMINI_API_KEY=unused" >> .env
          echo "SUPABASE_URL=${SUPABASE_URL}" >> .env
          echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}" >> .env
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
        continue-on-error: true

      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 1

      - name: Lint
        run: ./gradlew lintDebug --no-daemon
        continue-on-error: true

      - name: Upload lint report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 1

      - name: Check dependency alignment
        run: |
          ./gradlew app:dependencies --configuration debugRuntimeClasspath --no-daemon > deps.txt
          if grep -qE "io\.ktor.*:2\." deps.txt; then
            echo "::error::Ktor 2.x resolved alongside supabase 3.x"; exit 1
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zad-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7


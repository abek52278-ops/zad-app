name: Edge Functions

# الإيدج فانكشنز مكانش عليها أي CI خالص — الـworkflow التاني كله كوتلن
# (`testDebugUnitTest` / `lintDebug` / `assembleDebug`). يعني الـ120 اختبار Deno كانوا
# بيشتغلوا لما حد يفتكر يشغّلهم محليًا بس، والنص التاني من التطبيق (العقل، الأدوات،
# الڤاليديتورز، مسح الحساب) كان بيتنشر على الإنتاج من غير أي بوابة.
#
# `deno check` بقى ينفع يبقى بوابة بعد ما اتنضفت ١٥ غلطة TS18046 قديمة كانت بتخلّيه
# راسب دايمًا — قبل كده مكانش ينفع يتحط هنا أصلاً لأنه كان هيفشل على كود شغّال.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/edge-functions.yml"
  pull_request:
    paths:
      - "supabase/functions/**"
      - ".github/workflows/edge-functions.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # نفس الترتيب اللي بيتعمل محليًا: التحقق من الأنواع الأول، وبعدين الاختبارات.
      # فشل التحقق بيوقّف الشغل قبل ما الاختبارات تدّي رسالة أقل وضوحًا.
      - name: Type-check zad-brain
        working-directory: supabase/functions/zad-brain
        run: deno check index.ts callModel.ts validators.ts shared.ts audit.ts

      - name: Test zad-brain
        working-directory: supabase/functions/zad-brain
        run: deno test --allow-all

      - name: Type-check zad-core-intelligence
        working-directory: supabase/functions/zad-core-intelligence
        run: deno check index.ts redact.ts

      - name: Test zad-core-intelligence
        working-directory: supabase/functions/zad-core-intelligence
        run: deno test --allow-all

      - name: Type-check delete-account
        working-directory: supabase/functions/delete-account
        run: deno check index.ts

      - name: Type-check zad-telegram-bot
        working-directory: supabase/functions/zad-telegram-bot
        run: deno check index.ts context.ts telegram.ts

      - name: Test zad-telegram-bot
        working-directory: supabase/functions/zad-telegram-bot
        run: deno test --allow-all

  # النشر من الريبو، بعد ما الفحص يعدي — مش من على جهاز حد.
  #
  # الانحراف بين الريبو والمنشور مش احتمال نظري هنا، هو حصل فعلاً: في 2026-08-01 النسخة
  # المنشورة v89 كانت فقدت أكشن nearby_pois وبرومبتات الفاتورة المتشددة وحواجز
  # "متقترحش إلغاء التزام ثابت" — وكلهم كانوا موجودين في git. وCLAUDE.md لسه بيقول
  # "قارن المنشور بالريبو قبل ما تفترض إن أي طرف هو المرجع"، وهي نصيحة صحيحة بس بتعالج
  # العرض. السبب إن النشر كان خطوة يدوية منفصلة عن الفحص.
  #
  # بيشتغل على main بس، ومربوط بنجاح check — كود مايعديش الأنواع أو التستات مابيوصلش
  # للإنتاج. الـ migrations بتتدفع في نفس الخطوة عشان السكيما والكود اللي بيعتمد عليها
  # ما يتفرقوش (زي zad_subscription_next_renewal اللي الفانكشن محتاجاها موجودة).
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # الـ project ref مش سر — هو موجود في supabase/config.toml في الريبو أصلاً، وRLS هي
      # الحماية مش خفاء المعرّف. قراءته من الملف بدل سر إضافي معناها سر أقل ممكن ينسى
      # يتحط فيفشل النشر لسبب مالوش علاقة بالكود.
      - name: Read project ref
        run: echo "PROJECT_REF=$(grep -oP '(?<=^id = ")[^"]+' supabase/config.toml)" >> "$GITHUB_ENV"

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "$PROJECT_REF"
          supabase db push

      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for fn in zad-brain zad-core-intelligence zad-telegram-bot delete-account; do
            echo "::group::deploy $fn"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
            echo "::endgroup::"
          done

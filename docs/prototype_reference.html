function actions() {

  return {
    toggleLang: function(){ state.lang = ar ? 'en' : 'ar'; render(); },
    enterApp: function(){ state.showSplash = false; render(); },
    openSheet: function(){ state.sheetOpen = true; render(); },
    closeSheet: function(){ state.sheetOpen = false; render(); },
    goTo: function(s){ state.screen = s; state.moreOpen = false; render(); },
    openMore: function(){ state.moreOpen = true; render(); },
    closeMore: function(){ state.moreOpen = false; render(); },
    openDrawer: function(){ state.drawerOpen = true; render(); },
    closeDrawer: function(){ state.drawerOpen = false; render(); },
    goToFromDrawer: function(s){ state.screen = s; state.drawerOpen = false; render(); },
    openCamera: function(){ state.cameraOpen = true; render(); },
    closeCamera: function(){ state.cameraOpen = false; render(); },
    toggleKidsMode: function(){ state.kidsMode = !state.kidsMode; state.screen = 'home'; render(); },
    exitKidsMode: function(){ state.kidsMode = false; state.screen = 'profile'; render(); },
    confirmItem: function(idx){ state.confirmed[idx] = true; render(); },
    setInvCat: function(id){ state.invCat = id; render(); },
    setAssistantTab: function(tab){ state.assistantTab = tab; render(); },
    setFamilyTab: function(tab){ state.familyTab = tab; render(); },
    tapTasbiha: function(){
      var goal = 100;
      var next = Math.min(goal, state.tasbihaCount + 1);
      try { localStorage.setItem('zad-tasbiha-garden-standalone', JSON.stringify({ date: new Date().toDateString(), count: next })); } catch(e){}
      if (navigator.vibrate) navigator.vibrate(12);
      var justCompleted = next === goal && state.tasbihaCount < goal;
      state.tasbihaCount = next;
      if (justCompleted) { state.showConfetti = true; setTimeout(function(){ state.showConfetti = false; render(); }, 2200); }
      render();
    },
  };
}

function render() {
  var ar = state.lang === 'ar';
  var t = STRINGS[state.lang];
  var root = document.getElementById('scroll');
  root.setAttribute('dir', ar ? 'rtl' : 'ltr');
  root.style.background = 'linear-gradient(165deg,#F4F5F7 0%,#ECEEF1 45%,#E9ECEF 100%)';

  var html = '';
  if (state.showSplash) {
    html = renderSplash(t, ar);
  } else {
    var screen = (state.kidsMode && state.screen !== 'family') ? 'home' : state.screen;
    var body;
    if (screen === 'home' && state.kidsMode) body = renderKidsHome(t, ar);
    else if (screen === 'home') body = renderHome(t, ar);
    else if (screen === 'inventory') body = renderInventory(t, ar);
    else if (screen === 'shopping') body = renderShopping(t, ar);
    else if (screen === 'budget') body = renderBudget(t, ar);
    else if (screen === 'assistant') body = renderAssistant(t, ar);
    else if (screen === 'subs') body = renderSubs(t, ar);
    else if (screen === 'family') body = renderFamily(t, ar);
    else if (screen === 'pharmacy') body = renderPharmacy(t, ar);
    else if (screen === 'maintenance') body = renderMaintenance(t, ar);
    else if (screen === 'deals') body = renderDeals(t, ar);
    else if (screen === 'profile') body = renderProfile(t, ar);
    else if (screen === 'notifications') body = renderNotifications(t, ar);
    else body = renderHome(t, ar);

    html = renderHeader(t, ar) + body
      + (state.kidsMode ? renderKidsNav(t) : renderFullNav(t))
      + renderDrawer(t, ar) + renderMoreSheet(t) + renderCameraSheet(t) + renderSheet(t, ar);
  }
  root.innerHTML = html;
}

document.getElementById('scroll').addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var act = el.getAttribute('data-act');
  var arg = el.getAttribute('data-arg');

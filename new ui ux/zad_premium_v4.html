<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZAD — Premium iPhone UI</title>
<style>
/* ═══════════════ ZAD PREMIUM — iPhone-grade Design System ═══════════════ */
:root{
  --g900:#052E16; --g800:#064E3B; --g700:#0B6B4E; --g600:#0F9B76; --g500:#1BB383; --g400:#34D399;
  --mint:#6EE7B7; --mint100:#D9F2E6; --mint50:#E6F4EC;
  --canvas:#F2F2F7; --ink:#0F172A; --slate:#374151; --gray500:#6B7280; --gray400:#9CA3AF;
  --warn:#B45309; --danger:#DC5B4B; --info:#2563EB; --violet:#7C3AED; --pink:#EC4899;
  --amberDot:#F4A93B; --coralDot:#FF8066;
  --card-r:20px; --hero-r:28px; --pill-r:9999px;
  --shadow-card:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.08);
  --shadow-float:0 20px 44px rgba(6,78,59,.35);
  --ease-ios:cubic-bezier(.32,.72,0,1);
  --ease-premium:cubic-bezier(.22,1,.36,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:#101318;font-family:-apple-system,'SF Pro Display','Cairo',system-ui,sans-serif;overflow:hidden}
button{font-family:inherit;border:none;background:none;cursor:pointer}
::-webkit-scrollbar{display:none}

/* ─── Stage ─── */
#stage{height:100vh;display:flex;align-items:center;justify-content:center;gap:60px;padding:24px;
  background:radial-gradient(1200px 800px at 20% 10%,#1a2230 0%,#101318 60%);}
.brand{color:#fff;display:flex;flex-direction:column;gap:14px;max-width:300px}
.brand h1{font-size:44px;font-weight:800;letter-spacing:-1px;
  background:linear-gradient(120deg,#fff,#6EE7B7,#0F9B76);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:shimmer 6s ease infinite;background-size:200% 200%}
.brand p{color:#9CA3AF;font-size:14px;line-height:1.7}
.brand .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.brand .chips span{font-size:11px;font-weight:700;color:#6EE7B7;background:rgba(110,231,183,.08);
  border:1px solid rgba(110,231,183,.15);border-radius:99px;padding:5px 12px}
@keyframes shimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

/* ─── Phone frame ─── */
#phone{width:402px;height:874px;border-radius:55px;position:relative;flex-shrink:0;
  background:#000;padding:8px;
  box-shadow:0 0 0 2px #3a3f47,0 0 0 5px #1a1d22,0 50px 100px rgba(0,0,0,.7),0 20px 60px rgba(6,78,59,.25);
  transform-style:preserve-3d;transition:transform .8s var(--ease-premium);}
#phone:hover{transform:rotateX(2deg) rotateY(-2deg)}
#screen{width:100%;height:100%;border-radius:47px;overflow:hidden;position:relative;background:var(--canvas)}
#notch{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:120px;height:34px;border-radius:20px;background:#000;z-index:100}
#screen::before{content:'';position:absolute;inset:0;z-index:90;pointer-events:none;border-radius:47px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);}

/* ─── Keyframes ─── */
@keyframes fadeUp{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes meshShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(110,231,183,.4)}50%{box-shadow:0 0 0 14px rgba(110,231,183,0)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes wave{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}85%{opacity:.6}100%{transform:translateY(-140px);opacity:0}}
@keyframes tickerMove{0%{transform:translateX(0)}100%{transform:translateX(50%)}}
@keyframes drawCheck{to{stroke-dashoffset:0}}
@keyframes orbRotate{to{transform:rotate(360deg)}}
@keyframes card3d{0%,100%{transform:perspective(800px) rotateX(0) rotateY(0)}50%{transform:perspective(800px) rotateX(2deg) rotateY(-2deg) translateY(-4px)}}
@keyframes dotPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.7}}

/* ─── Canvas bg ─── */
#bg{position:absolute;inset:0;background:linear-gradient(165deg,#F4F5F7 0%,#ECEEF1 45%,#E9ECEF 100%)}

/* ─── Splash ─── */
#splash{position:absolute;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(120% 100% at 15% 10%,rgba(252,211,199,.5) 0%,transparent 55%),
             radial-gradient(120% 100% at 85% 90%,rgba(191,227,209,.55) 0%,transparent 55%),#FBFAF8;
  transition:opacity .6s var(--ease-ios),transform .6s var(--ease-ios)}
#splash.hide{opacity:0;transform:scale(1.08);pointer-events:none}
.carrot{width:84px;height:84px;animation:carrotIn .8s var(--ease-premium) both,floatY 3s ease-in-out .8s infinite;
  filter:drop-shadow(0 14px 28px rgba(240,112,61,.35))}
@keyframes carrotIn{0%{opacity:0;transform:scale(.6) rotate(-10deg)}60%{opacity:1;transform:scale(1.08) rotate(3deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
#splash .logo{font-size:40px;font-weight:800;color:var(--g600);letter-spacing:-1px;animation:fadeUp .7s ease .3s both}
#splash .slogan{font-size:16px;font-weight:600;color:var(--slate);animation:fadeUp .7s ease .45s both}
#splash .sub{font-size:13px;color:var(--gray400);animation:fadeUp .7s ease .55s both}
#enterBtn{position:absolute;bottom:70px;background:var(--g800);color:#fff;font-size:16px;font-weight:700;
  border-radius:99px;padding:17px 56px;box-shadow:0 14px 34px rgba(6,78,59,.35);
  animation:fadeUp .7s ease .7s both;transition:transform .15s var(--ease-spring)}
#enterBtn:active{transform:scale(.94)}

/* ─── Header ─── */
#header{position:sticky;top:0;z-index:20;background:rgba(249,250,251,.85);backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  padding:58px 20px 14px;display:flex;flex-direction:column;gap:12px;
  border-bottom:1px solid rgba(6,78,59,.07);animation:fadeUp .4s ease both}
.hdr-row{display:flex;align-items:center;justify-content:space-between}
.hdr-left{display:flex;align-items:center;gap:10px}
.icon-btn{width:34px;height:34px;border-radius:11px;background:rgba(6,78,59,.08);
  display:flex;align-items:center;justify-content:center;transition:transform .15s var(--ease-spring),background .2s}
.icon-btn:active{transform:scale(.88);background:rgba(6,78,59,.15)}
.icon-btn svg{width:17px;height:17px;stroke:var(--g800)}
.carrot-tile{width:34px;height:34px;border-radius:10px;background:var(--mint50);display:flex;align-items:center;justify-content:center}
.wordmark{font-weight:800;font-size:20px;color:var(--g800);letter-spacing:-.3px}
.badge-kids{font-size:11px;font-weight:700;color:var(--violet);background:rgba(124,58,237,.1);border-radius:99px;padding:4px 10px}
#screenTitle{font-size:27px;font-weight:800;color:var(--ink);letter-spacing:-.4px}
.bell-wrap{position:relative}
.bell-dot{position:absolute;top:6px;inset-inline-end:6px;width:8px;height:8px;border-radius:50%;
  background:var(--danger);animation:dotPulse 2s ease infinite}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--g800),var(--g600));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;
  box-shadow:0 4px 12px rgba(6,78,59,.25)}

/* ─── Body / screens ─── */
#scroll{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain}
.page{padding:16px 20px 140px;display:flex;flex-direction:column;gap:16px}
.page>*{animation:fadeUp .5s var(--ease-premium) both}
.stagger>*{animation:fadeUp .5s var(--ease-premium) both}
.stagger>*:nth-child(1){animation-delay:.03s}.stagger>*:nth-child(2){animation-delay:.08s}
.stagger>*:nth-child(3){animation-delay:.13s}.stagger>*:nth-child(4){animation-delay:.18s}
.stagger>*:nth-child(5){animation-delay:.23s}.stagger>*:nth-child(6){animation-delay:.28s}
.stagger>*:nth-child(7){animation-delay:.33s}.stagger>*:nth-child(8){animation-delay:.38s}
.stagger>*:nth-child(9){animation-delay:.43s}.stagger>*:nth-child(10){animation-delay:.48s}
.stagger>*:nth-child(11){animation-delay:.53s}.stagger>*:nth-child(12){animation-delay:.58s}

/* ─── Cards ─── */
.card{background:#fff;border-radius:var(--card-r);padding:15px;box-shadow:var(--shadow-card)}
.card-lg{border-radius:18px;padding:16px}
.press{transition:transform .18s var(--ease-spring)}
.press:active{transform:scale(.955)}
.sect-title{font-size:15.5px;font-weight:800;color:var(--ink)}
.sect-head{display:flex;justify-content:space-between;align-items:center}
.see-all{font-size:13px;font-weight:700;color:var(--g800)}

/* ─── Hero wallet card ─── */
.hero{border-radius:var(--hero-r);padding:26px 24px 22px;color:#fff;position:relative;overflow:hidden;cursor:pointer;
  background:linear-gradient(120deg,#0B6B4E,#0F9B76,#064E3B,#0B6B4E);background-size:300% 300%;
  animation:meshShift 9s ease infinite,fadeUp .55s var(--ease-premium) both;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),var(--shadow-float);
  transition:transform .3s var(--ease-premium)}
.hero:active{transform:scale(.97)}
.hero::after{content:'';position:absolute;top:-60%;inset-inline-start:-20%;width:70%;height:120%;
  background:radial-gradient(closest-side,rgba(255,255,255,.14),transparent);pointer-events:none}
.hero .lbl{font-size:12px;font-weight:700;letter-spacing:.5px;color:rgba(255,255,255,.72)}
.hero .amt{font-size:46px;font-weight:800;letter-spacing:-1.5px;margin:6px 0 14px;
  background:linear-gradient(180deg,#fff,#D9F2E6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.chip-row{display:flex;gap:10px;flex-wrap:wrap}
.gchip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.15);border-radius:99px;padding:8px 14px;font-size:12.5px;font-weight:600}
.gdot{width:8px;height:8px;border-radius:50%}
.gdot.amber{background:var(--amberDot);box-shadow:0 0 10px 2px rgba(244,169,59,.7)}
.gdot.coral{background:var(--coralDot);box-shadow:0 0 10px 2px rgba(255,128,102,.7)}
.wallet-stripes{position:absolute;bottom:0;left:0;right:0;height:5px;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.25) 0 10px,transparent 10px 20px)}

/* ─── Stat duo ─── */
.duo{display:flex;gap:12px}
.duo .card{flex:1;display:flex;flex-direction:column;gap:4px}
.duo .k{font-size:11.5px;font-weight:600;color:var(--gray500)}
.duo .v{font-size:24px;font-weight:800;color:var(--ink);letter-spacing:-.5px}
.duo .v small{font-size:13px;font-weight:600;color:var(--gray400)}

/* ─── Shortcut tiles ─── */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tile{display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer}
.tile .tile-ic{width:52px;height:52px;border-radius:17px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 4px rgba(15,23,42,.05),0 10px 20px rgba(15,23,42,.07);
  transition:transform .2s var(--ease-spring)}
.tile:active .tile-ic{transform:scale(.86)}
.tile span{font-size:10.5px;font-weight:700;color:var(--gray500);text-align:center}
.tile svg{width:22px;height:22px}

/* ─── Ticker ─── */
.ticker{display:flex;gap:8px;overflow:hidden;position:relative;
  mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.ticker-track{display:flex;gap:8px;animation:tickerMove 22s linear infinite;width:max-content;padding-inline-end:8px}
.tick{flex-shrink:0;display:flex;align-items:center;gap:6px;background:#fff;border-radius:99px;padding:8px 13px;
  box-shadow:var(--shadow-card);font-size:12.5px}
.tick b{font-weight:800;color:var(--ink)}
.tick .d{font-size:11px;font-weight:800}
.up{color:var(--g800)}.down{color:var(--danger)}.flat{color:var(--gray400)}

/* ─── Insights ─── */
.insight{display:flex;gap:12px;align-items:flex-start;background:rgba(255,255,255,.85);backdrop-filter:blur(14px);
  border:1px solid rgba(0,0,0,.05);border-radius:var(--card-r);padding:15px 16px;box-shadow:var(--shadow-card);cursor:pointer}
.insight .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex-shrink:0;animation:dotPulse 2.4s ease infinite}
.insight .t{font-size:14.5px;font-weight:700;color:var(--ink)}
.insight .s{font-size:13px;color:var(--gray500);line-height:1.45;margin-top:3px}
.pill{font-size:11px;font-weight:800;border-radius:99px;padding:5px 11px;flex-shrink:0;white-space:nowrap}

/* ─── AI dark panel ─── */
.ai-panel{background:linear-gradient(135deg,#052E16,#0A382C);border-radius:var(--card-r);padding:18px;
  display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;
  box-shadow:0 16px 36px rgba(5,46,22,.3)}
.ai-panel::before{content:'';position:absolute;top:-40px;inset-inline-end:-40px;width:140px;height:140px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(110,231,183,.22),transparent);animation:breathe 4s ease infinite}
.ai-panel .t{font-size:12.5px;font-weight:800;color:var(--mint);display:flex;align-items:center;gap:7px}
.ai-panel .b{font-size:14px;color:#fff;line-height:1.6;position:relative}
.ai-chips{display:flex;gap:8px;flex-wrap:wrap;position:relative}
.ai-chips span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.08);color:#fff;
  font-size:11.5px;font-weight:700;border-radius:99px;padding:7px 13px;transition:background .2s}
.ai-chips span:active{background:rgba(255,255,255,.22)}

/* ─── Progress bars ─── */
.meter{height:8px;border-radius:99px;background:rgba(15,23,42,.07);overflow:hidden}
.meter>i{display:block;height:100%;border-radius:99px;transform-origin:right;
  animation:growBar 1s var(--ease-premium) both}
@keyframes growBar{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* ─── Tasbiha garden ─── */
.garden{background:rgba(255,255,255,.7);backdrop-filter:blur(14px);border:1px solid rgba(0,0,0,.05);
  border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow-card)}
.garden .emoji-zone{display:flex;align-items:center;justify-content:center;padding:8px 0;position:relative;min-height:70px}
.garden .tree{font-size:56px;line-height:1;cursor:pointer;user-select:none;transition:transform .15s var(--ease-spring);
  filter:drop-shadow(0 10px 18px rgba(15,23,42,.18));animation:floatY 3.4s ease-in-out infinite}
.garden .tree:active{transform:scale(.82)}
.petal{position:absolute;font-size:17px;pointer-events:none;animation:rise 1.4s ease-out forwards}
.tap-btn{background:var(--violet);color:#fff;font-size:13px;font-weight:800;border-radius:99px;padding:10px 22px;
  box-shadow:0 8px 18px rgba(124,58,237,.32);transition:transform .15s var(--ease-spring)}
.tap-btn:active{transform:scale(.92)}

/* ─── Tx rows ─── */
.tx{background:#fff;border-radius:14px;padding:13px 15px;display:flex;justify-content:space-between;align-items:center;
  box-shadow:var(--shadow-card)}
.tx .t{font-size:13.5px;font-weight:700;color:var(--ink)}
.tx .d{font-size:11.5px;color:var(--gray400);margin-top:2px}
.tx .a{font-size:14px;font-weight:800}
.neg{color:var(--danger)}.pos{color:var(--g800)}

/* ─── Section grid 2col ─── */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2 .card{display:flex;flex-direction:column;gap:5px}
.stat-k{font-size:11px;font-weight:700;color:var(--gray400)}
.stat-v{font-size:19px;font-weight:800;color:var(--ink)}

/* ─── Chef / feature rows ─── */
.feat{background:#fff;border-radius:18px;padding:16px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow-card)}
.feat .fic{width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.feat .t{font-size:14px;font-weight:800;color:var(--ink)}
.feat .s{font-size:12.5px;color:var(--gray500);line-height:1.45;margin-top:3px}

/* ─── Amazon horizontal ─── */
.hscroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory}
.hscroll>*{scroll-snap-align:start;flex-shrink:0}
.amz{width:146px;background:#fff;border-radius:16px;padding:11px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow-card)}
.amz .img{height:84px;border-radius:11px;background:linear-gradient(135deg,#F1F4F3,#E6F4EC);
  display:flex;align-items:center;justify-content:center;font-size:34px}
.amz .t{font-size:12px;font-weight:700;color:var(--ink);line-height:1.35}
.amz .p{display:flex;justify-content:space-between;align-items:center}
.amz .price{font-size:13px;font-weight:800;color:var(--warn)}
.amz .badge{font-size:9.5px;font-weight:800;color:var(--gray400)}

/* ─── Inventory ─── */
.warn-strip{background:rgba(220,91,75,.08);border-radius:14px;padding:13px 15px;font-size:12.5px;font-weight:700;color:var(--danger);
  display:flex;align-items:center;gap:9px}
.chips-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.fchip{flex-shrink:0;display:flex;align-items:center;gap:6px;border-radius:99px;padding:6px 13px 6px 7px;
  font-size:12.5px;font-weight:800;background:#fff;color:var(--slate);box-shadow:var(--shadow-card);transition:all .25s var(--ease-premium)}
.fchip .cic{width:21px;height:21px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px}
.fchip.on{background:var(--g800);color:#fff;transform:scale(1.05)}
.inv-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.inv-card{background:#fff;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow-card)}
.inv-top{display:flex;justify-content:space-between;align-items:flex-start}
.inv-name{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--ink)}
.inv-emoji{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px}
.inv-cat{font-size:12px;color:var(--gray400)}
.inv-days{font-size:11.5px;font-weight:700;color:var(--gray500)}
.confirm-btn{background:rgba(228,87,46,.12);color:var(--danger);font-size:10.5px;font-weight:800;border-radius:99px;padding:4px 9px}

/* ─── Segmented tabs ─── */
.seg{display:flex;gap:5px;background:#fff;border-radius:99px;padding:4px;box-shadow:var(--shadow-card)}
.seg button{flex:1;border-radius:99px;padding:10px 4px;font-size:12.5px;font-weight:800;color:var(--gray500);
  transition:all .3s var(--ease-premium);position:relative}
.seg button.on{background:var(--g800);color:#fff;box-shadow:0 4px 12px rgba(6,78,59,.3)}

/* ─── List rows with accent ─── */
.lrow{background:#fff;border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;
  box-shadow:var(--shadow-card);position:relative;overflow:hidden}
.lrow::before{content:'';position:absolute;inset-inline-start:0;top:0;bottom:0;width:3.5px;background:var(--accent,var(--g800))}
.lrow .t{font-size:14px;font-weight:700;color:var(--ink)}
.lrow .s{font-size:11.5px;color:var(--gray400);margin-top:3px}
.lrow .end{font-size:14px;font-weight:800;color:var(--ink)}

/* ─── Chat ─── */
.chat{display:flex;flex-direction:column;gap:12px}
.msg{max-width:80%;padding:12px 15px;border-radius:18px;font-size:14px;line-height:1.5;animation:fadeUp .4s var(--ease-premium) both}
.msg.ai{background:#fff;color:var(--ink);box-shadow:var(--shadow-card);border-start-start-radius:6px}
.msg.me{background:var(--g800);color:#fff;align-self:flex-end;border-start-end-radius:6px;box-shadow:0 6px 16px rgba(6,78,59,.25)}
.typing{display:flex;gap:4px;padding:14px 16px;background:#fff;border-radius:18px;border-start-start-radius:6px;width:fit-content;box-shadow:var(--shadow-card)}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--gray400);animation:wave 1.2s ease infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}

function sparkline(){
  const max=Math.max(...TREND),min=Math.min(...TREND),w=280,h=64;
  const pts=TREND.map((v,i)=>`${(i/(TREND.length-1)*w).toFixed(1)},${(h-((v-min)/((max-min)||1))*(h-10)-5).toFixed(1)}`).join(' ');
  return `<svg width="100%" height="64" viewBox="0 0 280 64" preserveAspectRatio="none" style="overflow:visible">
    <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0F9B76" stop-opacity=".35"/><stop offset="1" stop-color="#0F9B76" stop-opacity="0"/></linearGradient></defs>
    <polygon points="0,${h} ${pts} ${w},${h}" fill="url(#sg)"/>
    <polyline points="${pts}" fill="none" stroke="#0F9B76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="600" stroke-dashoffset="600" style="animation:drawLine 1.4s var(--ease-premium) forwards"/>
    <style>@keyframes drawLine{to{stroke-dashoffset:0}}</style>
  </svg>`;
}

/* ═══════════ NAV / SHELL ═══════════ */
function navHTML(){
  if(st.kids){
    return `<div id="nav">
      <div class="nav-item on"><span style="color:#fff">🏠 ${T.tabHome}</span></div>
      <div class="nav-item" onclick="UI.kidsFamily()"><span style="color:rgba(255,255,255,.7)">👨‍👩‍👧 العائلة</span></div>
      <button class="cam-btn" onclick="UI.openVoice()"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round"><path d="M12 2a3 3 0 013 3v6a3 3 0 01-6 0V5a3 3 0 013-3zM19 10v1a7 7 0 01-14 0v-1M12 18v4"/></svg></button>
    </div>`;
  }
  const items=[['home','tabHome','M2 9L11 2l9 7v9a1 1 0 01-1 1h-5v-6H8v6H3a1 1 0 01-1-1V9z'],
    ['inventory','tabInventory','M3 9l1-5h16l1 5M4 9h16v10a1 1 0 01-1 1H5a1 1 0 01-1-1V9zM9 13h6']];
  return `<div id="nav">
    ${items.map(i=>`<div class="nav-item ${st.screen===i[0]?'on':''}" onclick="UI.go('${i[0]}')">
      <svg viewBox="0 0 22 20" fill="none" stroke-width="1.8" stroke-linejoin="round"><path d="${i[2]}"/></svg><span>${T[i[1]]}</span></div>`).join('')}
    <button class="cam-btn" onclick="UI.openCamera()"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13.5" r="3.5"/><path d="M8 7l1.5-2.5h5L16 7"/></svg></button>
    <div class="nav-item ${st.screen==='assistant'?'on':''}" onclick="UI.go('assistant')">
      <svg viewBox="0 0 22 20" fill="none" stroke-width="1.8" stroke-linejoin="round"><path d="M1 3.5A2 2 0 013 1.5h15a2 2 0 012 2V13a2 2 0 01-2 2H8l-5 4v-4H3a2 2 0 01-2-2V3.5z"/></svg><span>${T.tabAssistant}</span></div>
    <div class="nav-item" onclick="UI.openMore()">
      <svg viewBox="0 0 20 20" fill="none"><circle cx="4" cy="10" r="1.7" fill="#9CA3AF"/><circle cx="10" cy="10" r="1.7" fill="#9CA3AF"/><circle cx="16" cy="10" r="1.7" fill="#9CA3AF"/></svg>
      <span>${T.tabMore}</span></div>
  </div>`;
}

function drawerHTML(){
  return `<div class="scrim ${st.drawer?'show':''}" style="z-index:44" onclick="UI.closeDrawer()"></div>
  <div class="drawer ${st.drawer?'show':''}">
    <div class="drawer-hdr">
      <div class="carrot-tile"><svg width="18" height="18" viewBox="0 0 64 64"><path d="M31 16C36 20 42 30 40 44C39 51 34 58 29 57C24 56 21 50 22 43C24 30 27 21 31 16Z" fill="#F0703D"/><path d="M29 17C27 13 28 9 26 6M32 15C32 11 34 8 33 4M35 17C37 14 40 12 40 8" stroke="#3CA06E" stroke-width="3.2" stroke-linecap="round"/></svg></div>

function sheetsHTML(){

      <div class="more-item" style="animation-delay:${i*0.04}s" onclick="UI.goFromMore('${m.go}')">
        <div class="mi" style="background:${m.bg}"><span style="font-size:19px">${m.e}</span></div><span>${m.n}</span></div>`).join('')}

      <span class="sheet-title">${T.sheetWhy}</span>
      <div style="display:flex;flex-direction:column;gap:13px">
        <div class="why-row"><span><span class="why-dot" style="background:var(--amberDot)"></span>${T.spent}</span><b>1,120 ر.س</b></div>
        <div class="why-row"><span><span class="why-dot" style="background:var(--coralDot)"></span>${T.committed}</span><b>640 ر.س</b></div>
        <div style="height:1px;background:rgba(0,0,0,.06)"></div>

/* ═══════════ MAIN RENDER ═══════════ */
function render(){
  const scr=$('#scroll');
  const keep=scr.scrollTop;
  const body= st.splash?''
    : st.kids&&st.screen!=='family' ? pKidsHome()
    : {home:pHome,inventory:pInventory,shopping:pShopping,budget:pBudget,assistant:pAssistant,
       subs:pSubs,family:pFamily,pharmacy:pPharmacy,maintenance:pMaint,deals:pDeals,
       profile:pProfile,notifications:pNotifs,tasbiha:pTasbiha}[st.screen]?.()||pHome();
  scr.innerHTML=(st.splash?'':`<div id="pageWrap">${body}</div>`)+sheetsHTML()+navHTML();
  scr.scrollTop=keep;
  if(!st.splash) header();
  document.body.classList.toggle('kids',st.kids);
}

/* ═══════════ ACTIONS ═══════════ */
const UI={
  enter(){st.splash=false;const sp=$('#splash');if(sp){sp.classList.add('hide');setTimeout(()=>sp.remove(),650);}render();},
  go(s){if(st.kids&&s!=='home'&&s!=='family'){UI.toast('محتاج PIN لفتح ده 🔒');return;}
    st.screen=s;st.more=false;st.drawer=false;render();$('#scroll').scrollTo({top:0,behavior:'smooth'});},
  goFromDrawer(s){st.drawer=false;setTimeout(()=>UI.go(s),180);render();},
  goFromMore(s){st.more=false;setTimeout(()=>UI.go(s),200);render();},
  kidsFamily(){st.screen='family';render();},
  openDrawer(){st.drawer=true;render();}, closeDrawer(){st.drawer=false;render();},
  openMore(){st.more=true;render();}, closeMore(){st.more=false;render();},
  openCamera(){st.camera=true;render();}, closeCamera(){st.camera=false;render();},
  openWhy(){st.why=true;render();}, closeWhy(){st.why=false;render();},
  openVoice(){$('#voiceOverlay').classList.add('show');},
  closeVoice(){$('#voiceOverlay').classList.remove('show');},
  setCat(c){st.invCat=c;render();},
  setAssist(t){st.assistTab=t;render();},
  setFam(t){st.familyTab=t;render();},
  confirmItem(n){st.confirmed[n]=true;render();UI.toast(T.toastAdded);},
  toggleKids(){st.kids=!st.kids;if(st.kids)st.screen='home';render();
    UI.toast(st.kids?'وضع الأطفال مفعّل 🧒':'الوضع الكامل 🔓');},
  exitKids(){st.kids=false;st.screen='profile';render();UI.toast('الوضع الكامل 🔓');},
  send(){const f=$('#chatField');if(!f||!f.value.trim())return;
    st.typing=true;render();
    setTimeout(()=>{st.typing=false;render();UI.toast(T.sent);},1400);},
  tapTasbih(e){
    st.tasbiha=Math.min(100,st.tasbiha+1);
    const zone=$('#gardenZone');
    if(e&&zone){
      const p=document.createElement('span');p.className='petal';
      p.textContent=Math.random()>.5?'🍃':'🌸';
      p.style.left=(40+Math.random()*20)+'%';p.style.top='55%';
      p.style.animationDuration=(1.1+Math.random()*.5)+'s';
      zone.appendChild(p);setTimeout(()=>p.remove(),1500);
    }
    if(navigator.vibrate)navigator.vibrate(12);
    if(st.tasbiha===100)UI.toast('🌳 شجرتك أثمرت! مبروك');
    render();
  },
  toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');
    clearTimeout(UI._tt);UI._tt=setTimeout(()=>t.classList.remove('show'),1900);}
};
window.UI=UI;

/* splash boot */
function boot(){
  render(); // render() renders app body only when !st.splash
  // Paint splash on top (outside #scroll so re-renders never wipe it)
  const sp=document.createElement('div');
  sp.id='splash';
  sp.innerHTML=`
    <svg class="carrot" viewBox="0 0 64 64"><path d="M31 16C36 20 42 30 40 44C39 51 34 58 29 57C24 56 21 50 22 43C24 30 27 21 31 16Z" fill="#F0703D"/><path d="M25.5 30.5L34.5 33.5M24 38L33 41M25.5 45.5L31.5 47.5" stroke="#FBFAF8" stroke-width="2" stroke-linecap="round"/><path d="M29 17C27 13 28 9 26 6M32 15C32 11 34 8 33 4M35 17C37 14 40 12 40 8" stroke="#3CA06E" stroke-width="3.2" stroke-linecap="round"/></svg>
    <div class="logo" style="margin-top:18px">ZAD</div>
    <div class="slogan" style="margin-top:8px">${T.slogan}</div>
    <div class="sub">Smart care for your home</div>
    <div style="margin-top:56px;width:38px;height:4px;border-radius:99px;background:rgba(15,23,42,.12);animation:fadeUp .6s ease .5s both"></div>
    <button id="enterBtn" onclick="UI.enter()">${T.ctaEnter}</button>`;
  $('#screen').appendChild(sp);
}
boot();
</script>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZAD</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{background:#EAE7E0;font-family:-apple-system,'SF Pro Text',system-ui,sans-serif}
  button{font-family:inherit;cursor:pointer}
  .press:active{transform:scale(0.94)}
  #scroll::-webkit-scrollbar{display:none}
  #scroll{scrollbar-width:none}
  @keyframes zadFadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  @keyframes zadCarrotIn{0%{opacity:0;transform:scale(.7) rotate(-8deg)}60%{opacity:1;transform:scale(1.06) rotate(2deg)}100%{opacity:1;transform:scale(1) rotate(0deg)}}
  @keyframes zadCarrotFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes zadMeshShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  @keyframes zadRise{0%{transform:translateY(0);opacity:0}15%{opacity:1}85%{opacity:.6}100%{transform:translateY(-130px);opacity:0}}
  @keyframes zadRingSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  @keyframes zadFillIn{0%{opacity:0;transform:scale(.85)}100%{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<div id="root"></div>
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="app.js"></script>
</body>
</html>
